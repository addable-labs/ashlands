<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <title>Ashlands — An Elder Scrolls Chapter</title>
    <style>
      html,body{margin:0;height:100%;background:#07070a;overflow:hidden;
        font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;color:#d9c9a3}
      #view{display:block;width:100%;height:100%;cursor:crosshair}
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:18px;background:#07070a;z-index:100;transition:opacity .8s}
      #boot.done{opacity:0;pointer-events:none}
      #boot h1{font-size:13px;letter-spacing:.62em;font-weight:400;text-transform:uppercase;
        margin:0;color:#8b7a56}
      #bar{width:260px;height:1px;background:#241f16;overflow:hidden}
      #bar>i{display:block;height:100%;width:0;background:#c8a95e;transition:width .25s}
      #blabel{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#4e452f;height:1em}
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="boot">
      <h1>Ashlands</h1>
      <div id="bar"><i></i></div>
      <div id="blabel"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
